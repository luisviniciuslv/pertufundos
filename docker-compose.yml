services:
  postgres:
    image: postgres:16-alpine
    container_name: pertufundos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pertufundos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pertufundos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pertufundos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/infrastructure/persistence/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pertufundos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
