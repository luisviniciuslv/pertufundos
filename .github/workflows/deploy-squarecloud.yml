name: Deploy Unificado na Square Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependências do monorepo
        run: pnpm install --frozen-lockfile

      - name: Rodar testes unitários, integração e typecheck
        run: |
          pnpm --filter @pertufundos/shared build
          pnpm test
          pnpm typecheck

      - name: Gerar bundle unificado da Square Cloud (.zip)
        run: node scripts/build-squarecloud-bundle.mjs

      - name: Enviar commit para Square Cloud e reiniciar container
        env:
          SQUARECLOUD_API_KEY: ${{ secrets.SQUARECLOUD_API_KEY }}
          SQUARECLOUD_APP_ID: ${{ vars.SQUARECLOUD_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SQUARECLOUD_API_KEY:-}" ] || [ -z "${SQUARECLOUD_APP_ID:-}" ]; then
            echo "ℹ️ SQUARECLOUD_API_KEY/SQUARECLOUD_APP_ID não configurados; pulando deploy via Actions (usando Webhook nativo da Square Cloud)."
            exit 0
          fi

          RESP=$(curl -sS -X POST "https://api.squarecloud.app/v2/apps/${SQUARECLOUD_APP_ID}/commit" \
            -H "Authorization: ${SQUARECLOUD_API_KEY}" \
            -F "file=@pertufundos-squarecloud.zip")
          echo "Commit response: ${RESP}"
          echo "${RESP}" | grep -q '"status":"success"'

          RESTART_RESP=$(curl -sS -X POST "https://api.squarecloud.app/v2/apps/${SQUARECLOUD_APP_ID}/restart" \
            -H "Authorization: ${SQUARECLOUD_API_KEY}")
          echo "Restart response: ${RESTART_RESP}"
          echo "${RESTART_RESP}" | grep -q '"status":"success"'
